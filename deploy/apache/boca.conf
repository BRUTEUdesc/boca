# vhost do BOCA (fork BRUTEUdesc), modelo tirado de prod (.68) em 2026-11-13:
# sites-available/000-boca-custom.conf (:80) + 000-boca-le-ssl.conf (:443, gerado pelo certbot).
#
# deploy/setup-server.sh só instala este arquivo (como sites-available/000-boca-brute.conf) quando
# nenhum site habilitado aponta para /var/www/boca, e só o habilita se o certificado do Let's Encrypt
# já existir. Num servidor que já tem o site, nada aqui é aplicado: mudanças no vhost de prod
# continuam manuais (e devem ser copiadas para cá).

<VirtualHost *:80>
    ServerAdmin boca@bombonera.org
    DocumentRoot /var/www/boca/src/
    ServerName boca.joinville.udesc.br

	Redirect permanent / https://boca.joinville.udesc.br/

    # Alias /boca /var/www/boca/src

    <Directory "/var/www/boca/src">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        AddDefaultCharset utf-8
    </Directory>

    <Directory "/var/www/boca/">
        AllowOverride None
        Require all denied
    </Directory>

    <Directory "/var/www/boca/src/private">
        AllowOverride None
        Require all denied
    </Directory>

	RewriteEngine on

	RewriteCond %{SERVER_NAME} =boca.joinville.udesc.br
	RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerAdmin boca@bombonera.org
    DocumentRoot /var/www/boca/src/
    ServerName boca.joinville.udesc.br

    Redirect permanent /boca /
    # Alias /boca /var/www/boca/src

    <Directory "/var/www/boca/src">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        AddDefaultCharset utf-8
    </Directory>

    <Directory "/var/www/boca/">
        AllowOverride None
        Require all denied
    </Directory>

    <Directory "/var/www/boca/src/private">
        AllowOverride None
        Require all denied
    </Directory>

    # hardening 2026-11-12: arquivos que nao devem ser servidos pela web
    <Directory "/var/www/boca/src/autojudgeip">
        <Files "ip_aj*">
            Require all denied
        </Files>
    </Directory>
    <Directory "/var/www/boca/src">
        <Files "test.php">
            Require all denied
        </Files>
    </Directory>

    ProxyPreserveHost On
    ProxyRequests Off

    RewriteEngine On

    # WebSocket para /animeitor/api/allruns_ws e /animeitor/api/timer
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/animeitor/(.*) ws://127.0.0.1:8000/$1 [P,L]

    # Animeitor em /animeitor/
    RedirectMatch permanent ^/animeitor$ /animeitor/


    ProxyPass        /animeitor/ http://127.0.0.1:8000/
    ProxyPassReverse /animeitor/ http://127.0.0.1:8000/

    SSLCertificateFile /etc/letsencrypt/live/boca.joinville.udesc.br/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/boca.joinville.udesc.br/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
